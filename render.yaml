services:
  # ─────────────────────────────────────────────────────────────────
  # 1. Backend Service (NestJS)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: taskvault-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskvault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_JWT_SECRET
        sync: false # Set this in Render dashboard
      - key: FRONTEND_URL
        value: https://taskvault-frontend.onrender.com

  # ─────────────────────────────────────────────────────────────────
  # 2. Frontend Service (Next.js)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: taskvault-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://taskvault-backend.onrender.com/api
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false # Set this in Render dashboard
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false # Set this in Render dashboard

databases:
  # ─────────────────────────────────────────────────────────────────
  # 3. PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────
  - name: taskvault-db
    plan: free
